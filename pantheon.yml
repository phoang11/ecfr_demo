api_version: 1

web_docroot: true

workflows:
  sync_code:
    before:
      - type: webphp
        description: Clear dblog
        script: private/scripts/clear-dblog.php
    after:
      - type: webphp
        description: Config import
        script: private/scripts/1-config-import.php
      # - type: webphp
      #   description: Install module
      #   script: private/scripts/2-install-module.php
      - type: webphp
        description: Import regulations
        script: private/scripts/4-import-regulations.php
      - type: webphp
        description: Import regulations
        script: private/scripts/4-import-regulations.php
